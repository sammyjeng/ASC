[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jeng-asc"
version = "0.1.2"
description = "Fork of Droid ASC with a MUTF-8 decode fix so obfuscated class names resolve."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "androguard>=4.1.3",
]

[project.urls]
Homepage = "https://github.com/sammyjeng/asc"
Upstream = "https://github.com/MG1937/ASC"

[project.scripts]
droidasc = "droidasc:main"

[tool.setuptools.packages.find]
include = ["droidasc", "droidasc.*"]

[tool.setuptools.package-data]
"droidasc" = ["py.typed"]
